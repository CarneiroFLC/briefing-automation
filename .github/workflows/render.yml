name: Render Briefing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install weasyprint
      
      - name: Find latest JSON and render
        run: |
          LATEST_JSON=$(ls -t output/briefing_*.json 2>/dev/null | head -1)
          if [ -n "$LATEST_JSON" ]; then
            echo "Renderizando: $LATEST_JSON"
            python render_briefing.py "$LATEST_JSON"
          else
            echo "Nenhum JSON encontrado"
          fi
      
      - name: Commit and push HTML/PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/*.html output/*.pdf 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Briefing renderizado - $(date +%Y-%m-%d_%H:%M:%S)"
          git push
