on:
  schedule:
    # Roda 06:15 (15min após Routine às 06:00)
    - cron: '00 5 * * 1-5'
  
  workflow_dispatch:  # Permite rodar manualmente

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install weasyprint
      
      - name: Render briefing
        run: |
          HOJE=$(date +%Y%m%d)
          JSON_FILE="output/briefing_$HOJE.json"
          
          if [ -f "$JSON_FILE" ]; then
            python .github/scripts/render_briefing.py "$JSON_FILE"
            echo "✅ Rendered briefing_$HOJE"
          else
            echo "⚠️ JSON not found for today"
          fi
      
      - name: Upload to artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: briefing-output
          path: output/briefing_*.{html,pdf}
          retention-days: 30


