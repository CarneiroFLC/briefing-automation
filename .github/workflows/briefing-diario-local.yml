name: 📊 Briefing Diário Automático (Local)

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch

jobs:
  briefing:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 weasyprint pillow
      
      - name: 📡 Gerar Briefing
        run: |
          echo "Iniciando geração do briefing..."
          python scripts/briefing_generator.py
          echo "Briefing gerado com sucesso"
      
      - name: 📂 Verificar arquivos gerados
        run: |
          echo "Arquivos gerados:"
          ls -lh output/briefing_*
      
      - name: 📝 Commit dos arquivos
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Briefing Bot"
          git add output/briefing_*.json output/briefing_*.html output/briefing_*.pdf 2>/dev/null || true
          git commit -m "Briefing diario - $(date +'%Y-%m-%d %H:%M')" || echo "Nada para commitar"
          git push
      
      - name: ✅ Sucesso!
        run: |
          echo "Pipeline concluido com sucesso!"
          echo "Briefing gerado e salvo no repositorio"
